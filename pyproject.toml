[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autofixai"
version = "0.4.1"
description = "Automatic detection, repair, validation and explanation of common Python bugs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Komali" }]
keywords = ["automated-program-repair", "static-analysis", "ast", "debugging", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyflakes>=3.0"]

[project.urls]
Homepage = "https://github.com/KomaliG7/AutoFixAI"
Issues = "https://github.com/KomaliG7/AutoFixAI/issues"
Changelog = "https://github.com/KomaliG7/AutoFixAI/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
autofix = "autofixai.cli:main"

[tool.setuptools.packages.find]
include = ["autofixai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets plain `pytest` import the top-level `benchmark` package

[tool.ruff]
line-length = 120
extend-exclude = ["samples", "benchmark/cases.py"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "UP007", "UP045"]
